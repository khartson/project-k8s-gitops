apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.longhorn.io'
    targetRevision: 1.12.0
    chart: longhorn
    helm:
      values: |
        preUpgradeChecker:
          jobEnabled: false
        ingress:
          enabled: true
          ingressClassName: tailscale
          host: longhorn
          tls: true
          path: /
  destination:
    server: 'https://kubernetes.default.svc' # Fixed K8s cluster API endpoint
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
