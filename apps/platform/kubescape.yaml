apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescape
  namespace: argocd # change to the argocd namespace
spec:
  destination:
    namespace: kubescape
    server: 'https://kubernetes.default.svc' # change to your server
  source:
    repoURL: https://kubescape.github.io/helm-charts/
    chart: kubescape-operator
    targetRevision: 1.41.0
    helm:
      valuesObject:
        certificates:
          strategy: initContainer # Important - prevents ArgoCD drift!
        clusterName: 'project-k8s' # add cluster name
        capabilities:
          runtimeDetection: enable # proactive runtime threat alerts from node-agent
        # Requests trimmed to fit the 1 vCPU worker; limits left at chart defaults
        kubescape:
          resources:
            requests:
              cpu: 50m
        kubevuln:
          resources:
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
        storage:
          resources:
            requests:
              cpu: 50m
        nodeAgent:
          resources:
            requests:
              cpu: 50m
        # imagePullSecrets: "" # reference to existing secret in same namespace
        # credentials:
        #   cloudSecret: "" # reference to existing secret in same namespace, contains `account` & `accessKey`
  project: default
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        # node-agent needs hostPID, hostPath and extra capabilities for eBPF runtime monitoring
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true