apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - chart: sealed-secrets
      repoURL: https://bitnami.github.io/sealed-secrets
      targetRevision: 2.19.1
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/manifests/sealed-secrets/values.yaml
    - repoURL: https://github.com/khartson/project-k8s-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
