apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-services
  namespace: argocd 
spec:
  project: default 
  source:
   repoURL: https://github.com/khartson/project-k8s-gitops.git 
    targetRevision: HEAD
    path: cluster-services
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd 
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true

