apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discord-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/khartson/project-k8s-gitops.git"
    targetRevision: HEAD
    path: workloads/discord-bot
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: discord-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
