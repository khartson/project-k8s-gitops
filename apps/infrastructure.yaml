apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.tail4e6a89.ts.net/Hatchet4445/project-k8s-gitops
    targetRevision: HEAD
    path: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale 
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
